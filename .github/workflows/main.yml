name: Django CI/CD

on:
  push:
    branches:
      - main
      - home_work

jobs:
  # 1. Запуск линтера и тестов
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # Проверка стиля кода
      - name: Run Linting (flake8)
        run: |
          flake8 . --exclude=migrations,venv,env,.* --max-line-length=120

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          SECRET_KEY: test_key
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          python manage.py test

  # 2. Сборка и отправка образа на Docker Hub
  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: kottt95
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: kottt95/lms_app:latest

  # 3. Деплой на сервер FirstVDS
  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/root/app
            git fetch origin
            git reset --hard origin/home_work
            git pull origin home_work  
            
            sudo systemctl stop nginx || echo "System nginx already stopped"
            sudo systemctl disable nginx || echo "System nginx already disabled"
            
            # Жестко удаляем контейнеры И старые объемы статики, чтобы пересоздать их с нуля
            docker compose down -v
            docker compose up -d --build
            
            sleep 7
            
            # Запускаем сборку статики
            docker compose exec -T app python manage.py collectstatic --no-input
            
            echo "=== ПРОВЕРЯЕМ, ГДЕ ЛЕЖИТ СТАТИКА В DJANGO ==="
            docker compose exec -T app ls -la /app/staticfiles || echo "No staticfiles in app"
            
            echo "=== ПРОВЕРЯЕМ, ВИДИТ ЛИ СТАТИКУ NGINX ==="
            docker compose exec -T nginx ls -la /app/staticfiles || echo "No staticfiles in nginx"
            
            docker compose ps